[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snn_bench"
dynamic = ["version"]
dependencies = [
  "torch",
  "torchsummary",
  "torchmetrics",
  "psutil",
  "pynvml",
]
authors = [
  { name="Stephen Michuki", email="stevemwendest@gmail.com" },
]
description = "A Project for independently testable components for data ingestion, ANN training, ANN to SNN conversion, evaluation and results visualization."
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[tool.hatch.version]
path = "src/snn_bench/__init__.py"

[project.urls]
Homepage = "https://github.com/Livewirez/snn_bench"
Repository = "https://github.com/Livewirez/snn_bench"
Issues = "https://github.com/Livewirez/snn_bench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/snn_bench"]